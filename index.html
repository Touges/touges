<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Touges — Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Instagram icon via Font Awesome CDN -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: white;
      color: black;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .logo img {
      max-width: 80%;
      max-height: 150px;
      margin-top: 40px;
    }

    .coming-soon {
      font-size: 8vw;
      font-weight: bold;
      margin-top: 40px;
    }

    @media (min-width: 768px) {
      .coming-soon {
        font-size: 3rem;
      }

      .logo img {
        max-width: 200px;
        max-height: 200px;
      }
    }

    .footer {
      margin-bottom: 30px;
    }

    .footer a {
      color: black;
      text-decoration: none;
      font-size: 24px;
    }

    .footer a:hover {
      color: gray;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="touges.png" alt="Logo">
  </div>
  <div class="coming-soon">COMING SOON</div>

  <div class="footer">
    <a href="https://instagram.com/tougesofficial" target="_blank" aria-label="Instagram">
      <i class="fab fa-instagram"></i>
    </a>
  </div>
</body>
</html>
