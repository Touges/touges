<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: white;
      color: black;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .logo img {
      max-width: 80%;
      height: auto;
      max-height: 150px;
      margin-bottom: 40px;
    }

    .coming-soon {
      font-size: 8vw;
      font-weight: bold;
    }

    @media (min-width: 768px) {
      .coming-soon {
        font-size: 3rem;
      }

      .logo img {
        max-width: 200px;
        max-height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="your-logo.png" alt="Logo">
  </div>
  <div class="coming-soon">COMING SOON</div>
</body>
</html>
