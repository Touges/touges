<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Touges</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: white;
      color: black;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 20px;
    }

    .logo img {
      max-width: 80%;
      max-height: 150px;
      margin: 40px auto 0;
      display: block;
    }

    .coming-soon {
      font-size: 8vw;
      font-weight: bold;
      margin-top: 40px;
    }

    @media (min-width: 768px) {
      .coming-soon {
        font-size: 3rem;
      }

      .logo img {
        max-width: 200px;
        max-height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="touges.png" alt="Logo">
  </div>
  <div class="container">
    <div class="coming-soon">COMING SOON</div>
  </div>
</body>
</html>
